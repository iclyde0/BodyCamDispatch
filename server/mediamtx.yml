# Lab config for the bodycam prototype.
# Anonymous publish/read on the LAN so the phone and the dispatch page can connect
# without accounts. Do not expose these ports to the public internet.

logLevel: info

api: true
apiAddress: :9997
apiAllowOrigins: ["*"]

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

rtsp: true
rtspAddress: :8554
rtmp: true
rtmpAddress: :1935
hls: true
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189

paths:
  all_others:
